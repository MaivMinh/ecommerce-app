# docker-compose.yml
version: "3.9"

services:
  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    container_name: minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # MinIO Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minh2000
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
