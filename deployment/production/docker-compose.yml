# docker-compose.yml
version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "6000:9000"     # S3 API
      - "6001:9001"     # MinIO Console
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
