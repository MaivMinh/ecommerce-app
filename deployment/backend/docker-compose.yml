      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=notify-service
      - SPRING_SQL_INIT_MODE=never
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-service:3306/ecommerce_notify
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - KAFKA_BROKER=kafka:9092
      - GRPC_SERVER_SUPPORT_SERVICE_ADDRESS=static://support-service:9096
      - GRPC_SERVER_PRODUCT_SERVICE_ADDRESS=static://product-service:9091
      - OTEL_SERVICE_NAME=notify-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
    depends_on:
      - service-discovery

networks:
  e-commerce:
    driver: "bridge"

# =======================
# Docker Volumes
# =======================
volumes:
  db-service:
    driver: local
  kafka_data:
    driver: local