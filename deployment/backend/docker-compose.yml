version: "3.8"

services:
  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    container_name: minio
    ports:
      - "7000:9000"     # S3 API
      - "7001:9001"     # MinIO Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"

  axon-server:
    image: axoniq/axonserver
    ports:
      - "8024:8024"
      - "8124:8124"
    networks:
      - e-commerce
    volumes:
      - "/root/data/axonserver-docker/data:/axonserver/data"
      - "/root/data/axonserver-docker/events:/axonserver/events"
      - "/root/data/axonserver-docker/config:/axonserver/config"
    restart: unless-stopped

  redis-service:
    image: redis:7.4
    restart: unless-stopped
    networks:
      - e-commerce
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 400M

  kafka:
    image: docker.io/bitnami/kafka:4.0
    ports:
      - "9092:9092"
    networks:
      - e-commerce
    volumes:
      - "kafka_data:/bitnami"
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  service-discovery:
    image: service-discovery:1.0
    restart: on-failure
    networks:
      - e-commerce
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=service-discovery
    ports:
      - "8761:8761"
    deploy:
      resources:
        limits:
          memory: 400M
    depends_on:
      - otel-collector

  api-gateway:
    image: api-gateway:1.0
    restart: on-failure
    networks:
      - e-commerce
    deploy:
      resources:
        limits:
          memory: 400M
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=api-gateway
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis-service
      - SPRING_DATA_REDIS_PORT=6379
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
    depends_on:
      - service-discovery

  # =======================
  # Event Service
  # =======================
  event-service:
    image: event-service:1.0
    networks:
      - e-commerce
    deploy:
      resources:
        limits:
          memory: 512M
    restart: on-failure
    ports:
      - "8089:8089"
      - "9097:9097"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_SQL_INIT_MODE=never
      - SPRING_APPLICATION_NAME=event-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-service:3306/ecommerce_event
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - GRPC_SERVER_SUPPORT_SERVICE_ADDRESS=static://support-service:9096
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - REDIS_HOST=http://redis-service
      - OTEL_SERVICE_NAME=event-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
    depends_on:
      - service-discovery

  # =======================
  # Order Service
  # =======================
  order-service:
    image: order-service:1.0
    networks:
      - e-commerce
    deploy:
      resources:
        limits:
          memory: 768M
    restart: on-failure
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=order-service
      - KAFKA_BROKER=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-service:3306/ecommerce_order
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - AXON_AXONSERVER_SERVERS=axon-server:8124
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
    depends_on:
      - service-discovery

  # =======================
  # Payment Service
  # =======================
  payment-service:
    deploy:
      resources:
        limits:
          memory: 512M
    image: payment-service:1.0
    restart: on-failure
    networks:
      - e-commerce
    env_file:
      - .env
    ports:
      - "8085:8085"
      - "9095:9095"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=payment-service
      - SPRING_SQL_INIT_MODE=never
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-service:3306/ecommerce_payment
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - AXON_AXONSERVER_SERVERS=axon-server:8124
      - OTEL_SERVICE_NAME=payment-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
    depends_on:
      - service-discovery

  # =======================
  # Product Service
  # =======================
  product-service:
    deploy:
      resources:
        limits:
          memory: 512M
    image: product-service:1.0
    restart: on-failure
    networks:
      - e-commerce
    env_file:
      - .env
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=product-service
      - SPRING_SQL_INIT_MODE=never
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-service:3306/ecommerce_product
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_HOST=http://redis-service
      - AXON_AXONSERVER_SERVERS=axon-server:8124
      - OTEL_SERVICE_NAME=product-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
    depends_on:
      - service-discovery

  # =======================
  # Realtime Gateway
  # =======================
  realtime-gateway:
    deploy:
      resources:
        limits:
          memory: 512M
    image: realtime-gateway:1.0
    restart: on-failure
    networks:
      - e-commerce
    env_file:
      - .env
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=realtime-gateway
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-service:3306/ecommerce_product
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_HOST=http://redis-service
      - OTEL_SERVICE_NAME=realtime-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
    depends_on:
      - service-discovery

  # =======================
  # Support Service
  # =======================
  support-service:
    deploy:
      resources:
        limits:
          memory: 512M
    image: support-service:1.0
    restart: on-failure
    networks:
