server:
  port: 8088

spring:
  application:
    name: realtime-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # /// MYSQL DATABASE CONFIGURATION ///
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_order}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:49@Da5J,[KsemDN}
  threads:
    virtual:
      enabled: true
  messages:
    basename: i18n/messages
    encoding: UTF-8

keycloak:
  realm: e-commerce
  credentials:
    client-id: ecommerce-backend
    client-secret: ${KAFKA_CREDENTIALS_CLIENT_SECRET:rDBwKuMWu9ZdKwrDujdzv26s1flOdEpI}
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:6060}


kafka:
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:realtime-gateway}
    max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:300}
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:6}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  otlp: # Vì sẽ push metrics, traces qua cho Otel Collector nên ở đây phải là otlp.
    metrics:
      export:
        url: ${OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: 5s
  metrics:
    distribution:
      percentiles-histogram:
        resilience4j:
          circuitbreaker:
            enabled: true
        http:
          server:
            requests:
              enabled: true

#Eureka client config.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
      preferIpAddress: true
    register-with-eureka: true
    fetch-registry: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000
      repositories:
        enabled: false


resilience4j:
  circuitbreaker:
    instances:
      event-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED

grpc:
  client:
    event-service:
      address: ${GRPC_CLIENT_EVENT_SERVICE_ADDRESS:${GRPC_SERVER_EVENT_SERVICE:static://localhost:9097}}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true
