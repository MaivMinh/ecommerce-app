server:
  port: 8087

spring:
  application:
    name: notify-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  cloud:
    function:
      definition: handleNotifyOrderConfirmed;handleNotifyOrderRolledBack
    stream:
      bindings: #  Destination bindings component là cầu nối và định nghĩa các kênh (channels) mà ứng dụng sẽ sử dụng để gửi hoặc nhận dữ liệu.
        springCloudBusInput:
          destination: springCloudBus
        handleOrderCreated-in-0:
          destination: order-created
          group: ${spring.application.name}
        handleNotifyOrderConfirmed-in-0:
          destination: notify-order-confirmed
          group: ${spring.application.name}
          content-type: application/json
        handleNotifyOrderRolledBack-in-0:
          destination: notify-order-rolledback
          group: ${spring.application.name}
          content-type: application/json
      kafka:
        binder:
          brokers:
            - ${KAFKA_BROKER:localhost:9092}
  mail:
    host: smtp.gmail.com
    port: 587
    username: maiminh1307200@gmail.com
    password: qktf ewmy hdfs mlhd
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: ${SPRING_SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_notify}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:49@Da5J,[KsemDN}
  messages:
    basename: i18n/messages
    encoding: UTF-8

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        resilience4j:
          circuitbreaker:
            enabled: true
        http:
          server:
            requests:
              enabled: true

#Eureka client config.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
      preferIpAddress: true
    register-with-eureka: true
    fetch-registry: true


grpc:
  client:
    support-service:
      address: ${GRPC_SERVER_SUPPORT_SERVICE_ADDRESS:static://localhost:9096}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true
    product-service:
      address: ${GRPC_SERVER_PRODUCT_SERVICE_ADDRESS:static://localhost:9091}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true

axon:
  axonserver:
    enabled: false


resilience4j:
  timelimiter:
    instances:
      support-service:
        timeout-duration: 10s
        cancel-running-future: true
  circuitbreaker:
    instances:
      product-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED