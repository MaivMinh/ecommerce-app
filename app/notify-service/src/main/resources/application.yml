server:
  port: 8087

spring:
  application:
    name: notify-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000
      repositories:
        enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: ${SPRING_SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_notify}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:49@Da5J,[KsemDN}
  messages:
    basename: i18n/messages
    encoding: UTF-8

kafka:
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:notify-service}
    max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:300}
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:6}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  otlp: # Vì sẽ push metrics, traces qua cho Otel Collector nên ở đây phải là otlp.
    metrics:
      export:
        url: ${OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: 5s
  metrics:
    distribution:
      percentiles-histogram:
        resilience4j:
          circuitbreaker:
            enabled: true
        http:
          server:
            requests:
              enabled: true

#Eureka client config.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
      preferIpAddress: true
    register-with-eureka: true
    fetch-registry: true


grpc:
  client:
    support-service:
      address: ${GRPC_CLIENT_SUPPORT_SERVICE_ADDRESS:${GRPC_SERVER_SUPPORT_SERVICE_ADDRESS:static://localhost:9096}}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true
    product-service:
      address: ${GRPC_CLIENT_PRODUCT_SERVICE_ADDRESS:${GRPC_SERVER_PRODUCT_SERVICE_ADDRESS:static://localhost:9091}}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true

resilience4j:
  timelimiter:
    instances:
      support-service:
        timeout-duration: 10s
        cancel-running-future: true
  circuitbreaker:
    instances:
      product-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED
