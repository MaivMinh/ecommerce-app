server:
  port: 8089

spring:
  application:
    name: event-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true


  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: ${SPRING_SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_game}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:49@Da5J,[KsemDN}
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  messages:
    basename: i18n/messages
    encoding: UTF-8

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        resilience4j:
          circuitbreaker:
            enabled: true
        http:
          server:
            requests:
              enabled: true

#Eureka client config.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
      preferIpAddress: true
    register-with-eureka: true
    fetch-registry: true

cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME:deozipakf}
  api:
    key: ${CLOUDINARY_API_KEY:617116739785479}
    secret: ${CLOUDINARY_API_SECRET:l43AgCl03cV8V008w_FRC2U79zM}


logging:
  level:
    net.devh.boot.grpc.server: DEBUG

grpc:
  server:
    port: 9097
  client:
    support-service:
      address: ${GRPC_SERVER_SUPPORT_SERVICE_ADDRESS:static://localhost:9096}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true


resilience4j:
  timelimiter:
    instances:
      support-service:
        timeout-duration: 10s
        cancel-running-future: true
  circuitbreaker:
    instances:
      support-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000
      repositories:
        enabled: false