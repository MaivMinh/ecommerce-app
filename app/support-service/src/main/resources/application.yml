server:
  port: 8086

spring:
  application:
    name: support-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  cloud:
    function:
      definition: handleOrderCreated
    stream:
      bindings: #  Destination bindings component là cầu nối và định nghĩa các kênh (channels) mà ứng dụng sẽ sử dụng để gửi hoặc nhận dữ liệu.
        springCloudBusInput:
          destination: springCloudBus
        handleOrderCreated-in-0:
          destination: order-created
          group: ${spring.application.name}
      kafka:
        binder:
          brokers:
            - ${KAFKA_BROKER:localhost:9094}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000
      repositories:
        enabled: false
  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: ${SPRING_SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_cart}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:49@Da5J,[KsemDN}
  messages:
    basename: i18n/messages
    encoding: UTF-8


management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  otlp: # Vì sẽ push metrics, traces qua cho Otel Collector nên ở đây phải là otlp.
    metrics:
      export:
        url: ${OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: 5s
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        resilience4j:
          circuitbreaker:
            enabled: true
        http:
          server:
            requests:
              enabled: true

#Eureka client config.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
      preferIpAddress: true
    register-with-eureka: true
    fetch-registry: true

cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME:deozipakf}
  api:
    key: ${CLOUDINARY_API_KEY:617116739785479}
    secret: ${CLOUDINARY_API_SECRET:l43AgCl03cV8V008w_FRC2U79zM}

file:
  storage:
    provider: CLOUDINARY



grpc:
  server:
    port: 9096
  client:
    product-service:
      address: ${GRPC_CLIENT_PRODUCT_SERVICE_ADDRESS:${GRPC_SERVER_PRODUCT_SERVICE_ADDRESS:${GRPC_SERVER_PRODUCT_SERVICE:static://localhost:9091}}}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true


resilience4j:
  timelimiter:
    instances:
      product-service:
        timeout-duration: 10s
        cancel-running-future: true
  circuitbreaker:
    instances:
      product-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET_NAME:ecommerce-support-service}
