server:
  port: 8084
spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Kafka Configuration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000
      repositories:
        enabled: false
  cloud:
    stream:
      bindings: #  Destination bindings component là cầu nối và định nghĩa các kênh (channels) mà ứng dụng sẽ sử dụng để gửi hoặc nhận dữ liệu.
        springCloudBusInput:
          destination: springCloudBus
        publishOrderCreated-out-0:
          destination: order-created
        publishNotifyOrderConfirmed-out-0:
          destination: notify-order-confirmed
        publishNotifyOrderRolledBack-out-0:
          destination: notify-order-rolledback
      kafka:
        binder:
          brokers:
            - ${KAFKA_BROKER:localhost:9092}
  messages:
    basename: i18n/messages
    encoding: UTF-8
  # /// MYSQL DATABASE CONFIGURATION ///
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_order}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:49@Da5J,[KsemDN}

kafka:
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:order-service}
    max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:300}
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:6}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        resilience4j:
          circuitbreaker:
            enabled: true
        http:
          server:
            requests:
              enabled: true
  otlp: # Vì sẽ push metrics, traces qua cho Otel Collector nên ở đây phải là otlp.
    metrics:
      export:
        url: ${OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: 5s
#Eureka client config.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
      preferIpAddress: true
    register-with-eureka: true
    fetch-registry: true


resilience4j:
  timelimiter:
    instances:
      support-service:
        timeout-duration: 10s
        cancel-running-future: true
      product-service:
        timeout-duration: 10s
        cancel-running-future: true
      payment-service:
        timeout-duration: 10s
        cancel-running-future: true
      event-service:
        timeout-duration: 10s
        cancel-running-future: true
  circuitbreaker:
    instances:
      support-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED
      product-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED
      payment-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED
      event-service:
        register-health-indicator: true
        sliding-window-size: 30
        minimum-number-of-calls: 30
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20000
        permitted-number-of-calls-in-half-open-state: 15
        sliding-window-type: COUNT_BASED

app:
  grpc:
    server:
      product-service: ${GRPC_SERVER_PRODUCT_SERVICE:static://localhost:9091}
      payment-service: ${GRPC_SERVER_PAYMENT_SERVICE:static://localhost:9095}
      support-service: ${GRPC_SERVER_SUPPORT_SERVICE:static://localhost:9096}
      event-service: ${GRPC_SERVER_EVENT_SERVICE:static://localhost:9097}